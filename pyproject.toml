[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-system"
version = "0.1.0"
description = "Local Russian technical report generation system"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "python-docx>=1.1,<2",
  "streamlit>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["report_system*"]

